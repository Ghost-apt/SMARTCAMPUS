services:
  # ==========================================
  # 1. DATABASE: MongoDB
  # ==========================================
  mongodb:
    image: mongo:7.0
    container_name: smartcampus-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - smartcampus-net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval \"db.adminCommand('ping')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # 2. AI MICROSERVICE: FastAPI (ML & RAG)
  # ==========================================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: smartcampus-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - INTERNAL_AI_KEY=${INTERNAL_AI_KEY:-smartcampus_internal_ai_secret_key_2026}
      - MODEL_PATH=app/ml/support_model.joblib
      - VECTOR_STORE_PATH=app/rag/store
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-mistral}
    volumes:
      - rag-vector-store:/app/app/rag/store
    networks:
      - smartcampus-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================
  # 3. BACKEND API: Node.js Express
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartcampus-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/smartcampus
      - JWT_SECRET=${JWT_SECRET:-supersecret_jwt_key_smartcampus_2026_dev_secure}
      - JWT_EXPIRES_IN=7d
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost}
      - AI_SERVICE_URL=http://ai-service:8000
      - INTERNAL_AI_KEY=${INTERNAL_AI_KEY:-smartcampus_internal_ai_secret_key_2026}
    depends_on:
      mongodb:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - smartcampus-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ==========================================
  # 4. FRONTEND: React SPA + Nginx Reverse Proxy
  # ==========================================
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: smartcampus-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - smartcampus-net
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

# ==========================================
# NAMED PERSISTENT VOLUMES
# ==========================================
volumes:
  mongo-data:
    name: smartcampus_mongo_data
  rag-vector-store:
    name: smartcampus_rag_vector_store

# ==========================================
# APPLICATION BRIDGED NETWORK
# ==========================================
networks:
  smartcampus-net:
    name: smartcampus_network
    driver: bridge
