name: SmartCampus AI — Continuous Integration (CI)

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

jobs:
  # ==========================================
  # 1. BACKEND TEST SUITE
  # ==========================================
  backend-tests:
    name: Backend API Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [ 20.x, 22.x ]
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Backend Verification Suite (47+ Automated Tests)
        working-directory: ./backend
        env:
          NODE_ENV: test
          JWT_SECRET: supersecret_jwt_key_smartcampus_ci_test_mode_32chars
          MONGODB_URI: mongodb://127.0.0.1:27017/smartcampus_ci_test
        run: npm test

  # ==========================================
  # 2. PYTHON AI & RAG MICROSERVICE TESTS
  # ==========================================
  ai-service-tests:
    name: AI/ML & RAG Microservice Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'ai-service/requirements.txt'

      - name: Install Python Dependencies
        working-directory: ./ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Verification Suite (12+ Tests)
        working-directory: ./ai-service
        run: pytest -v

  # ==========================================
  # 3. FRONTEND PRODUCTION BUILD
  # ==========================================
  frontend-build:
    name: Frontend Build & Asset Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./client
        run: npm ci

      - name: Build Production Frontend Bundle
        working-directory: ./client
        env:
          VITE_API_BASE_URL: /api
        run: npm run build

      - name: Run Frontend Verification Suite
        working-directory: ./client
        run: npm test

      - name: Verify dist output exists
        working-directory: ./client
        run: test -f dist/index.html
